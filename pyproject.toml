[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "serialscope"
dynamic = ["version"]
description = "A modern cross-platform serial terminal and engineering data tool."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7,<7",
    "pyqtgraph>=0.13.7,<0.14",
    "pyserial>=3.5,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.gui-scripts]
serialscope = "serialscope.app:main"

[tool.setuptools.dynamic]
version = {attr = "serialscope.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
